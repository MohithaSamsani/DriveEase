<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking Confirmed - DriveEase</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- Navigation -->

    <header class="navbar">

        <div class="logo">
            🚗 DriveEase
        </div>

        <nav>

            <a href="../index.html">Home</a>

            <a href="cars.html">Cars</a>

<a href="about.html">About</a>
<a href="pages/contact.html">Contact</a>
            <a href="#">Login</a>

        </nav>

    </header>


    <!-- Confirmation -->

    <main>

        <section class="confirmation-page">

            <div class="confirmation-card">

                <div class="success-icon">
                    ✓
                </div>

                <p class="confirmation-label">
                    BOOKING CONFIRMED
                </p>

                <h1>
                    Your Ride Is Ready!
                </h1>

                <p class="confirmation-message">
                    Your booking has been successfully confirmed.
                    We look forward to being part of your journey.
                </p>


                <div class="booking-id-box">

                    <span>
                        Booking ID
                    </span>

                    <strong id="booking-id">
                        DRV-2026-1001
                    </strong>

                </div>


                <div class="confirmed-details">

                    <div class="confirmed-item">

                        <span>Car</span>

                        <strong id="confirmation-car-name">
                            Maruti Swift
                        </strong>

                    </div>


                    <div class="confirmed-item">

                        <span>Rental Days</span>

                        <strong id="confirmation-days">
                            1 day
                        </strong>

                    </div>


                    <div class="confirmed-item">

                        <span>Total Paid</span>

                        <strong id="confirmation-total">
                            ₹1,500
                        </strong>

                    </div>

                </div>


                <div class="confirmation-actions">

                    <a
                        href="my-bookings.html"
                        class="confirm-btn"
                    >
                        View My Bookings
                    </a>


                    <a
                        href="cars.html"
                        class="confirm-back-btn"
                    >
                        Explore More Cars
                    </a>

                </div>

            </div>

        </section>

    </main>


    <script src="../js/script.js"></script>

</body>

</html>
